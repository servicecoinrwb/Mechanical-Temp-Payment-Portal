<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Temp - Payment Portal & Admin</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Ethers.js (v6) -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>

    <!-- Web3Auth (v9.4.4) -->
    <script src="https://cdn.jsdelivr.net/npm/@web3auth/modal@9.4.4/dist/modal.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@web3auth/ethereum-provider@9.4.4/dist/ethereumProvider.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .shadow-sm, .shadow-lg, .shadow-2xl { box-shadow: none !important; }
            .border { border: 1px solid #ddd !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-800">
    <div id="root"></div>

    <!-- MAIN SCRIPT -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyC8YsDjof0BjtQOZ4Clx7pCSSXNCa7DQp0",
            authDomain: "payment-portal-479614.firebaseapp.com",
            projectId: "payment-portal-479614",
            storageBucket: "payment-portal-479614.firebasestorage.app",
            messagingSenderId: "857909670758",
            appId: "1:857909670758:web:6e5ed6a04c53e11c27cea7",
            measurementId: "G-0W6T5ZYR7Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- WEB3AUTH CONFIGURATION ---
        const WEB3AUTH_CLIENT_ID = "BHF9CqnAVImFVStW0OXLuKvgef28VqIAZ8jyngsS-HSuAiuAsgIra04uPbO7-VZpccAdNt56DAWCDaZDbWP6PEA"; 
        const CHAIN_ID = "0xa4b1"; 
        const RPC_URL = "https://arb1.arbitrum.io/rpc";

        const { useState, useEffect, useMemo } = React;

        // --- ICONS ---
        const IconWrapper = ({ children, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );
        const CreditCard = (p) => <IconWrapper {...p}><rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" /></IconWrapper>;
        const CheckCircle2 = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></IconWrapper>;
        const Lock = (p) => <IconWrapper {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></IconWrapper>;
        const LogOut = (p) => <IconWrapper {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" /></IconWrapper>;
        const ArrowRight = (p) => <IconWrapper {...p}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></IconWrapper>;
        const Loader2 = (p) => <IconWrapper {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></IconWrapper>;
        const Printer = (p) => <IconWrapper {...p}><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect width="12" height="8" x="6" y="14" /></IconWrapper>;
        const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></IconWrapper>;
        const Users = (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
        const FileText = (p) => <IconWrapper {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></IconWrapper>;
        const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
        const ChevronLeft = (p) => <IconWrapper {...p}><path d="m15 18-6-6 6-6"/></IconWrapper>;
        const Wallet = (p) => <IconWrapper {...p}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" /><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></IconWrapper>;
        const ExternalLink = (p) => <IconWrapper {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" x2="21" y1="14" y2="3" /></IconWrapper>;
        const Edit = (p) => <IconWrapper {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></IconWrapper>;
        const QrCode = (p) => <IconWrapper {...p}><rect width="5" height="5" x="3" y="3" rx="1" /><rect width="5" height="5" x="16" y="3" rx="1" /><rect width="5" height="5" x="3" y="16" rx="1" /><path d="M21 16h-3a2 2 0 0 0-2 2v3" /><path d="M21 21v.01" /><path d="M12 7v3a2 2 0 0 1-2 2H7" /><path d="M3 12h.01" /><path d="M12 3h.01" /><path d="M12 16v.01" /><path d="M16 12h1" /><path d="M21 12v.01" /><path d="M12 21v-1" /></IconWrapper>;
        const Settings = (p) => <IconWrapper {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></IconWrapper>;
        const Fuel = (p) => <IconWrapper {...p}><path d="M3 22v-8a2 2 0 0 1 2-2h2.5a2 2 0 0 1 2 2v8"/><path d="M15 9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2Z"/><path d="M14 13h2a2 2 0 0 1 2 2v1a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-3.5"/><path d="M3 22h18"/><path d="M10 22V8a2 2 0 0 0-2-2H5.5a2 2 0 0 0-2 2v14"/></IconWrapper>;

        // --- CONSTANTS ---
        const LOGO_URL = "https://imageview.replit.app/objects/uploads/d16ab63e-1d1e-4b8f-863c-67e66e4894fc";
        const STRIPE_LINK = "https://buy.stripe.com/bIY01kg5K3zD5I4fYY?_gl=1*1drrzbk*_ga*MjA1MzE1MDM4OS4xNzY0MDk4ODc4*_ga_0G63KLB2B0*czE3NjQxMDQwODgkbzEkZzEkdDE3NjQxMDQxOTckajU2JGwwJGgw";
        const MOONPAY_BASE_URL = "https://buy.moonpay.com";
        
        // --- HELPERS ---
        const DB = {
            init: async () => {
                if (!localStorage.getItem('mt_vault_settings')) {
                    localStorage.setItem('mt_vault_settings', JSON.stringify({
                        address: "0xdFD1C01678e713FDe1630c9db921e6206f3795b4",
                        bankAddress: "",
                        percentage: 2
                    }));
                }
            },
            getVaultSettings: () => JSON.parse(localStorage.getItem('mt_vault_settings') || '{"address": "0xdFD1C01678e713FDe1630c9db921e6206f3795b4", "bankAddress": "", "percentage": 2}'),
            updateVaultSettings: (settings) => {
                localStorage.setItem('mt_vault_settings', JSON.stringify(settings));
                return settings;
            },
            addCustomer: async (customer) => {
                if(!customer.walletAddress) {
                    try {
                        const randomWallet = ethers.Wallet.createRandom();
                        customer.walletAddress = randomWallet.address;
                    } catch (e) {
                        customer.walletAddress = "0x" + Array(40).fill(0).map(()=>Math.floor(Math.random()*16).toString(16)).join('');
                    }
                }
                return await addDoc(collection(db, "customers"), customer);
            },
            updateCustomer: async (id, data) => {
                await updateDoc(doc(db, "customers", id), data);
            },
            deleteCustomer: async (id) => {
                await deleteDoc(doc(db, "customers", id));
            },
            addInvoice: async (invoice) => {
                return await addDoc(collection(db, "invoices"), invoice);
            },
            updateInvoiceStatus: async (id, status) => {
                const invoiceRef = doc(db, "invoices", id);
                await updateDoc(invoiceRef, { status: status });
            }
        };

        // --- COMPONENTS ---

        const Navbar = ({ user, onLogout }) => (
            <nav className="w-full bg-slate-900 border-b border-slate-800 px-4 py-4 flex justify-between items-center sticky top-0 z-50 shadow-md no-print text-white">
                <div className="flex items-center gap-3">
                    <div className="bg-white p-1 rounded">
                        <img src={LOGO_URL} alt="Mechanical Temp Logo" className="h-8 w-auto object-contain" />
                    </div>
                    <span className="font-bold text-lg hidden sm:block tracking-wide">Mechanical Temp</span>
                </div>
                {user && (
                    <div className="flex items-center gap-4">
                        <div className="hidden md:flex flex-col items-end">
                            <span className="text-xs text-slate-400 uppercase tracking-wider">{user.isAdmin ? 'Administrator' : 'Customer'}</span>
                            <span className="text-sm font-medium text-white">{user.email || (user.walletAddress && user.walletAddress.substring(0,6)+'...') || 'User'}</span>
                        </div>
                        <div className={`h-9 w-9 rounded-full flex items-center justify-center font-bold text-white shadow-lg ${user.isAdmin ? 'bg-purple-600' : 'bg-sky-500'}`}>
                            {user.isAdmin ? 'A' : user.name ? user.name.charAt(0) : 'U'}
                        </div>
                        <button onClick={onLogout} className="p-2 text-slate-400 hover:text-red-400 transition-colors" title="Logout">
                            <LogOut size={18} />
                        </button>
                    </div>
                )}
            </nav>
        );

        const LoginScreen = ({ onLogin }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState("");

            const login = async () => {
                setIsLoading(true);
                setError("");
                try {
                    const { Web3Auth } = window.Modal;
                    const { EthereumPrivateKeyProvider } = window.EthereumProvider;

                    const chainConfig = {
                        chainNamespace: "eip155",
                        chainId: CHAIN_ID, 
                        rpcTarget: RPC_URL,
                        displayName: "Arbitrum One",
                        blockExplorerUrl: "https://arbiscan.io",
                        ticker: "ETH",
                        tickerName: "Ethereum",
                    };

                    const privateKeyProvider = new EthereumPrivateKeyProvider({ config: { chainConfig } });
                    
                    const web3auth = new Web3Auth({
                        clientId: WEB3AUTH_CLIENT_ID,
                        web3AuthNetwork: "sapphire_mainnet",
                        privateKeyProvider
                    });

                    await web3auth.initModal();
                    const provider = await web3auth.connect();
                    const userInfo = await web3auth.getUserInfo();
                    const ethersProvider = new ethers.BrowserProvider(provider);
                    const signer = await ethersProvider.getSigner();
                    const address = await signer.getAddress();

                    if (userInfo.email === "admin@mechanicaltemp.com") {
                        onLogin({ email: userInfo.email, isAdmin: true, name: "Admin", web3authInstance: web3auth });
                        return;
                    }

                    let q;
                    if(userInfo.email) {
                        q = query(collection(db, "customers"), where("email", "==", userInfo.email));
                    } else {
                        q = query(collection(db, "customers"), where("walletAddress", "==", address));
                    }
                    
                    const querySnapshot = await getDocs(q);
                    let userData;
                    
                    if (!querySnapshot.empty) {
                        const docData = querySnapshot.docs[0].data();
                        userData = {
                            id: querySnapshot.docs[0].id,
                            email: userInfo.email || docData.email,
                            name: docData.name || userInfo.name || "User",
                            walletAddress: address, 
                            isAdmin: false,
                            address: docData.address || "",
                            web3authInstance: web3auth
                        };
                    } else {
                        userData = {
                            email: userInfo.email || "",
                            name: userInfo.name || "Guest",
                            walletAddress: address,
                            isAdmin: false,
                            isNew: true,
                            web3authInstance: web3auth
                        };
                    }
                    onLogin(userData);

                } catch (err) {
                    console.error("Web3Auth Login Error:", err);
                    setError("Login cancelled or failed.");
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-[80vh] flex flex-col items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
                        <div className="bg-slate-900 p-8 text-center">
                            <div className="bg-white p-3 rounded-xl inline-block mx-auto mb-6 shadow-md">
                                <img src={LOGO_URL} alt="Logo" className="h-12 w-auto" />
                            </div>
                            <h2 className="text-2xl font-bold text-white mb-2">Portal Login</h2>
                            <p className="text-slate-300">Mechanical Temp LLC</p>
                        </div>
                        
                        <div className="p-8 space-y-6">
                            <div className="text-center mb-6">
                                <p className="text-sm text-gray-500">Sign in securely with Google, Email, or your External Wallet (Metamask/Rabby).</p>
                            </div>
                            <button onClick={login} disabled={isLoading} className="w-full flex items-center justify-center gap-3 bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg shadow-sky-200 transform hover:scale-[1.02]">
                                {isLoading ? <Loader2 className="animate-spin" /> : <Wallet size={20} />}
                                <span>Log In to Portal</span>
                            </button>
                            <div className="text-center text-xs text-gray-400 mt-4 flex items-center justify-center gap-2">
                                <Lock size={12} /> <span>Powered by Web3Auth & Arbitrum</span>
                            </div>
                            {error && <p className="text-red-500 text-sm text-center mt-2">{error}</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ user, customers, invoices, onAddCustomer, onAddInvoice, onDeleteCustomer }) => {
            const [view, setView] = useState('dashboard');
            const [vaultSettings, setVaultSettings] = useState(DB.getVaultSettings());

            useEffect(() => { DB.init(); }, []);

            const handleFundGas = async (customerAddress) => {
                if (!user || !user.web3authInstance) return alert("Admin wallet not connected via Web3Auth to send funds.");
                
                const amount = "0.002";
                if(!confirm(`Send ${amount} ETH to customer ${customerAddress} for gas fees?`)) return;

                try {
                    const provider = new ethers.BrowserProvider(user.web3authInstance.provider);
                    const signer = await provider.getSigner();
                    
                    // Simple ETH Transfer
                    const tx = await signer.sendTransaction({
                        to: customerAddress,
                        value: ethers.parseEther(amount)
                    });
                    
                    alert(`Gas Sent! Transaction Hash:\n${tx.hash}`);
                } catch (e) {
                    console.error(e);
                    alert("Failed to send gas: " + (e.reason || e.message));
                }
            };

            const CustomerList = () => {
                return (
                    <div className="space-y-6 animate-in fade-in">
                        <div className="flex items-center gap-2 mb-4">
                            <button onClick={() => setView('dashboard')} className="hover:bg-gray-100 p-2 rounded-full"><ChevronLeft size={20} /></button>
                            <h2 className="text-2xl font-bold text-gray-900">Manage Customers</h2>
                            <button onClick={() => setView('add-customer')} className="ml-auto bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 shadow-sm"><Plus size={16} /> Add New</button>
                        </div>
                        <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 text-slate-500"><tr><th className="px-6 py-4">Name</th><th className="px-6 py-4">Email</th><th className="px-6 py-4">Address</th><th className="px-6 py-4">Wallet</th><th className="px-6 py-4 text-right">Actions</th></tr></thead>
                                <tbody className="divide-y divide-gray-100">
                                    {(customers || []).length === 0 ? <tr><td colSpan="5" className="p-8 text-center text-gray-400">No customers found.</td></tr> : (customers || []).map(c => (
                                        <tr key={c.id} className="hover:bg-slate-50">
                                            <td className="px-6 py-4 font-medium text-gray-900">{c.name}</td>
                                            <td className="px-6 py-4 text-gray-600">{c.email}</td>
                                            <td className="px-6 py-4 text-gray-500 truncate max-w-xs">{c.address}</td>
                                            <td className="px-6 py-4 font-mono text-xs text-sky-600">{c.walletAddress ? c.walletAddress.substring(0,6)+'...'+c.walletAddress.substring(c.walletAddress.length-4) : '-'}</td>
                                            <td className="px-6 py-4 text-right flex justify-end gap-2">
                                                <button onClick={() => handleFundGas(c.walletAddress)} className="text-gray-400 hover:text-yellow-600 p-2" title="Fund Gas (ETH)"><Fuel size={18} /></button>
                                                <button onClick={() => { if(confirm(`Delete ${c.name}?`)) onDeleteCustomer(c.id); }} className="text-gray-400 hover:text-red-600 p-2"><Trash2 size={18} /></button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const AddCustomerForm = () => {
                const [form, setForm] = useState({ name: "", email: "", address: "" });
                const [saving, setSaving] = useState(false);
                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setSaving(true);
                    await onAddCustomer(form);
                    setSaving(false);
                    setView('view-customers');
                };
                return (
                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm max-w-lg mx-auto animate-in fade-in slide-in-from-bottom-4">
                        <div className="flex items-center gap-2 mb-6 text-gray-900 font-bold text-xl"><button onClick={() => setView('view-customers')} className="hover:bg-gray-100 p-1 rounded"><ChevronLeft /></button><h3>Add New Customer</h3></div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input required className="w-full p-2 border rounded" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Customer Name"/>
                            <input required type="email" className="w-full p-2 border rounded" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="Email"/>
                            <textarea required className="w-full p-2 border rounded" value={form.address} onChange={e => setForm({...form, address: e.target.value})} placeholder="Billing Address"/>
                            <button disabled={saving} className="w-full bg-sky-500 hover:bg-sky-600 text-white py-2 rounded-lg font-bold">{saving ? "Saving..." : "Save Customer"}</button>
                        </form>
                    </div>
                );
            };

            const AddInvoiceForm = () => {
                const [customerId, setCustomerId] = useState("");
                const [items, setItems] = useState([{ desc: "", qty: 1, unitPrice: 0 }]);
                const [saving, setSaving] = useState(false);
                const addItem = () => setItems([...items, { desc: "", qty: 1, unitPrice: 0 }]);
                const updateItem = (idx, field, val) => {
                    const newItems = [...items];
                    newItems[idx][field] = val;
                    setItems(newItems);
                };
                const removeItem = (idx) => setItems(items.filter((_, i) => i !== idx));
                const handleSubmit = async (e) => {
                    e.preventDefault();
                    if(!customerId) return alert("Select a customer");
                    setSaving(true);
                    const newInvoice = {
                        id: `INV-${Date.now().toString().slice(-6)}`,
                        customerId: customerId,
                        date: new Date().toISOString().split('T')[0],
                        dueDate: "Net 30",
                        status: "Pending",
                        items: items.map(i => ({...i, unitPrice: parseFloat(i.unitPrice), qty: parseFloat(i.qty)}))
                    };
                    await onAddInvoice(newInvoice);
                    setSaving(false);
                    setView('dashboard');
                };
                return (
                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm max-w-2xl mx-auto animate-in fade-in slide-in-from-bottom-4">
                         <div className="flex items-center gap-2 mb-6 text-gray-900 font-bold text-xl"><button onClick={() => setView('dashboard')} className="hover:bg-gray-100 p-1 rounded"><ChevronLeft /></button><h3>Create Invoice</h3></div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <select className="w-full p-2 border rounded" value={customerId} onChange={e => setCustomerId(e.target.value)}>
                                <option value="">Select a Customer</option>
                                {(customers || []).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                            {items.map((item, idx) => (
                                <div key={idx} className="flex gap-2 mb-2">
                                    <input placeholder="Description" className="flex-1 p-2 border rounded" value={item.desc} onChange={e => updateItem(idx, 'desc', e.target.value)} required />
                                    <input type="number" placeholder="Qty" className="w-20 p-2 border rounded" value={item.qty} onChange={e => updateItem(idx, 'qty', e.target.value)} required />
                                    <input type="number" placeholder="Price" className="w-24 p-2 border rounded" value={item.unitPrice} onChange={e => updateItem(idx, 'unitPrice', e.target.value)} required />
                                    {items.length > 1 && <button type="button" onClick={() => removeItem(idx)} className="text-red-500 p-2"><Trash2 size={16}/></button>}
                                </div>
                            ))}
                            <button type="button" onClick={addItem} className="text-sm text-sky-600 font-medium flex items-center gap-1 mt-2">+ Add Item</button>
                            <div className="bg-slate-50 p-4 rounded text-right"><span className="text-gray-500 mr-2">Total:</span><span className="font-bold text-xl">${items.reduce((acc, i) => acc + (parseFloat(i.qty||0) * parseFloat(i.unitPrice||0)), 0).toFixed(2)}</span></div>
                            <button disabled={saving} className="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold">{saving ? "Generating..." : "Generate Invoice"}</button>
                        </form>
                    </div>
                );
            };

            const VaultSettings = () => {
                const [form, setForm] = useState({ ...vaultSettings });
                const [saved, setSaved] = useState(false);
                const handleSave = (e) => {
                    e.preventDefault();
                    setVaultSettings(DB.updateVaultSettings(form));
                    setSaved(true);
                    setTimeout(() => setSaved(false), 2000);
                };
                return (
                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm max-w-lg mx-auto animate-in fade-in slide-in-from-bottom-4">
                        <div className="flex items-center gap-2 mb-6 text-gray-900 font-bold text-xl"><button onClick={() => setView('dashboard')} className="hover:bg-gray-100 p-1 rounded"><ChevronLeft /></button><h3>Vault Allocation Settings</h3></div>
                        <form onSubmit={handleSave} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Vault (Profit) Address</label>
                                <input className="w-full p-2 border rounded font-mono text-sm" value={form.address} onChange={e => setForm({...form, address: e.target.value})} placeholder="0x..." />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Bank (Revenue) Wallet Address</label>
                                <input className="w-full p-2 border rounded font-mono text-sm" value={form.bankAddress} onChange={e => setForm({...form, bankAddress: e.target.value})} placeholder="0x..." />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Allocation Percentage (%)</label>
                                <input type="number" className="w-full p-2 border rounded" value={form.percentage} onChange={e => setForm({...form, percentage: parseFloat(e.target.value)})} placeholder="2" step="0.1" />
                            </div>
                            <button className="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg font-bold transition-colors">{saved ? "Settings Saved!" : "Save Configuration"}</button>
                        </form>
                    </div>
                );
            };

            if (view === 'add-customer') return <AddCustomerForm />;
            if (view === 'view-customers') return <CustomerList />;
            if (view === 'add-invoice') return <AddInvoiceForm />;
            if (view === 'settings') return <VaultSettings />;

            // SAFE REVENUE CALCULATION
            const totalRevenue = (invoices || []).reduce((acc, inv) => {
                const items = inv.items || [];
                return acc + items.reduce((s, i) => s + (parseFloat(i.qty || 0) * parseFloat(i.unitPrice || 0)), 0);
            }, 0);
            const vaultShare = totalRevenue * (vaultSettings.percentage / 100);

            return (
                <div className="space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                            <p className="text-gray-500 text-sm font-medium">Total Revenue</p>
                            <h3 className="text-2xl font-bold text-gray-900">${totalRevenue.toFixed(2)}</h3>
                        </div>
                        <div className="bg-purple-50 p-6 rounded-xl border border-purple-100 shadow-sm">
                            <div className="flex justify-between items-start">
                                <p className="text-purple-800 text-sm font-medium">Vault Share ({vaultSettings.percentage}%)</p>
                                <button onClick={() => setView('settings')} className="text-purple-400 hover:text-purple-600"><Settings size={16}/></button>
                            </div>
                            <h3 className="text-2xl font-bold text-purple-900">${vaultShare.toFixed(2)}</h3>
                            <p className="text-xs text-purple-600 mt-1 truncate" title={vaultSettings.address}>To: {vaultSettings.address.substring(0,8)}...</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                            <p className="text-gray-500 text-sm font-medium">Pending Invoices</p>
                            <h3 className="text-2xl font-bold text-orange-600">{(invoices || []).filter(i => i.status === 'Pending').length}</h3>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => setView('add-invoice')} className="flex items-center gap-2 bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm"><FileText size={18} /> New Invoice</button>
                        <button onClick={() => setView('view-customers')} className="flex items-center gap-2 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-slate-50 transition"><Users size={18} /> Manage Customers</button>
                        <button onClick={() => setView('settings')} className="ml-auto flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium transition"><Settings size={20} /> Vault Settings</button>
                    </div>
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div className="px-6 py-4 border-b border-gray-200 bg-slate-50 font-bold text-gray-700">All Invoices</div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 text-slate-500"><tr><th className="px-6 py-3">Invoice #</th><th className="px-6 py-3">Customer</th><th className="px-6 py-3">Date</th><th className="px-6 py-3">Amount</th><th className="px-6 py-3">Status</th></tr></thead>
                                <tbody className="divide-y divide-gray-100">
                                    {(invoices || []).map(inv => {
                                        const cust = (customers || []).find(c => c.id === inv.customerId);
                                        const items = inv.items || [];
                                        const total = items.reduce((acc, i) => acc + (parseFloat(i.qty||0) * parseFloat(i.unitPrice||0)), 0);
                                        return (
                                            <tr key={inv.id} className="hover:bg-slate-50">
                                                <td className="px-6 py-4 font-mono text-gray-600">{inv.id}</td>
                                                <td className="px-6 py-4 font-medium">{cust ? cust.name : 'Unknown'}</td>
                                                <td className="px-6 py-4 text-gray-500">{inv.date}</td>
                                                <td className="px-6 py-4 font-medium">${total.toFixed(2)}</td>
                                                <td className="px-6 py-4"><span className={`px-2 py-1 rounded-full text-xs font-bold ${inv.status === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{inv.status}</span></td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- CUSTOMER DASHBOARD ---
        const ManualCryptoWidget = ({ address, amount, onClose }) => {
            const [copied, setCopied] = useState(false);
            const handleCopy = () => { navigator.clipboard.writeText(address); setCopied(true); setTimeout(() => setCopied(false), 2000); };
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200">
                    <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                        <div className="bg-slate-900 p-4 flex justify-between items-center text-white"><span className="font-bold tracking-tight flex items-center gap-2"><QrCode size={18}/> Manual Transfer</span><button onClick={onClose} className="hover:bg-white/20 p-1 rounded transition-colors">✕</button></div>
                        <div className="p-6 flex-col flex items-center text-center space-y-4">
                            <div className="bg-white p-2 border border-gray-200 rounded-xl shadow-sm"><img src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${address}`} alt="Wallet QR" className="w-40 h-40 object-contain rounded-lg" /></div>
                            <div><p className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Send USDC (Arbitrum One)</p><div onClick={handleCopy} className="bg-slate-50 border border-slate-200 rounded-lg p-3 flex items-center gap-2 cursor-pointer hover:border-sky-400 hover:bg-sky-50 transition-all group"><code className="text-xs font-mono text-slate-600 break-all">{address}</code><div className="text-slate-400 group-hover:text-sky-500">{copied ? <CheckCircle2 size={16}/> : <ArrowRight size={16} className="-rotate-45"/>}</div></div>{copied && <p className="text-xs text-green-600 font-bold mt-2 animate-pulse">Address Copied!</p>}</div>
                            <button onClick={onClose} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-colors">I have sent the payment</button>
                        </div>
                    </div>
                </div>
            );
        };

        const InvoiceDetail = ({ invoice, customer, onBack, onPaymentSuccess }) => {
            const [paymentMethod, setPaymentMethod] = useState('stripe');
            const [showManualWidget, setShowManualWidget] = useState(false);
            
            // GET BUSINESS WALLET (VAULT) ADDRESS
            // Use DB helper if available or direct from localStorage to avoid async complexity in render
            // Default fallback if empty
            const savedSettings = localStorage.getItem('mt_vault_settings');
            const vaultSettings = savedSettings ? JSON.parse(savedSettings) : { address: "0xdFD1C01678e713FDe1630c9db921e6206f3795b4" };
            const businessAddress = vaultSettings.address || "0xdFD1C01678e713FDe1630c9db921e6206f3795b4"; 

            const items = invoice.items || [];
            const totalAmount = items.reduce((acc, item) => acc + (parseFloat(item.qty||0) * parseFloat(item.unitPrice||0)), 0);
            
            if (invoice.status === 'Paid') {
                return (
                    <div className="max-w-xl mx-auto text-center py-12">
                        <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600"><CheckCircle2 size={48} /></div>
                        <h2 className="text-3xl font-bold text-gray-900 mb-2">Invoice Paid</h2>
                        <button onClick={onBack} className="text-sky-600 hover:underline">Back to Invoices</button>
                    </div>
                );
            }
            const handlePayment = () => {
                if (paymentMethod === 'stripe') {
                    window.open(STRIPE_LINK, '_blank');
                } else if (paymentMethod === 'moonpay') {
                    // Use Business Address for MoonPay Destination
                    const moonPayLink = `${MOONPAY_BASE_URL}?currencyCode=usdc_arbitrum&walletAddress=${businessAddress}`;
                    if(confirm(`Opening MoonPay to buy USDC (Arbitrum).\n\nIMPORTANT: Ensure the destination address is set to the BUSINESS wallet:\n\n${businessAddress}\n\nClick OK to proceed.`)) window.open(moonPayLink, '_blank');
                } else {
                    setShowManualWidget(true);
                }
            };
            return (
                <div className="flex flex-col lg:flex-row gap-8 animate-in fade-in slide-in-from-bottom-4">
                    <div className="flex-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                        <div className="flex justify-between items-start mb-8 pb-8 border-b border-gray-100">
                            <div><button onClick={onBack} className="mb-4 text-sm text-gray-400 hover:text-gray-600 flex items-center gap-1 no-print"><ChevronLeft size={16}/> Back</button><h1 className="text-2xl font-bold text-gray-900">INVOICE</h1><p className="text-gray-500 mt-1">{invoice.id}</p></div>
                        </div>
                        <table className="w-full text-sm text-left mb-8"><thead className="bg-slate-50 text-slate-500 font-medium"><tr><th className="px-4 py-3">Description</th><th className="px-4 py-3 text-center">Qty</th><th className="px-4 py-3 text-right">Price</th><th className="px-4 py-3 text-right">Total</th></tr></thead>
                        <tbody className="divide-y divide-gray-100">{items.map((item, i) => (
                            <tr key={i}><td className="px-4 py-4">{item.desc}</td><td className="px-4 py-4 text-center">{item.qty}</td><td className="px-4 py-4 text-right">${parseFloat(item.unitPrice).toFixed(2)}</td><td className="px-4 py-4 text-right font-medium">${(parseFloat(item.qty)*parseFloat(item.unitPrice)).toFixed(2)}</td></tr>
                        ))}</tbody></table>
                        <div className="flex justify-end border-t border-gray-100 pt-6"><div className="w-48 flex justify-between items-center text-lg font-bold text-gray-900"><span>Total Due</span><span>${totalAmount.toFixed(2)}</span></div></div>
                    </div>
                    <div className="w-full lg:w-[380px] no-print">
                        <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sticky top-24">
                            <h3 className="font-bold text-gray-900 mb-4">Select Payment Method</h3>
                            <div onClick={() => setPaymentMethod('stripe')} className={`p-4 rounded-xl border-2 cursor-pointer mb-3 transition-all ${paymentMethod === 'stripe' ? 'border-[#635BFF] bg-indigo-50' : 'border-gray-100 hover:border-gray-200'}`}><div className="flex items-center gap-3"><div className={`p-2 rounded-lg ${paymentMethod === 'stripe' ? 'bg-[#635BFF] text-white' : 'bg-gray-100 text-gray-500'}`}><CreditCard size={20} /></div><div className="flex-1"><p className="font-semibold text-gray-900">Credit Card</p><p className="text-xs text-gray-500">via Stripe Checkout</p></div></div></div>
                            <div onClick={() => setPaymentMethod('moonpay')} className={`p-4 rounded-xl border-2 cursor-pointer mb-3 transition-all ${paymentMethod === 'moonpay' ? 'border-[#7D00FF] bg-purple-50' : 'border-gray-100 hover:border-gray-200'}`}><div className="flex items-center gap-3"><div className={`p-2 rounded-lg ${paymentMethod === 'moonpay' ? 'bg-[#7D00FF] text-white' : 'bg-gray-100 text-gray-500'}`}><Wallet size={20} /></div><div className="flex-1"><p className="font-semibold text-gray-900">Crypto / Card</p><p className="text-xs text-gray-500">via MoonPay</p></div></div></div>
                            <div onClick={() => setPaymentMethod('manual')} className={`p-4 rounded-xl border-2 cursor-pointer mb-6 transition-all ${paymentMethod === 'manual' ? 'border-sky-500 bg-sky-50' : 'border-gray-100 hover:border-gray-200'}`}><div className="flex items-center gap-3"><div className={`p-2 rounded-lg ${paymentMethod === 'manual' ? 'bg-sky-500 text-white' : 'bg-gray-100 text-gray-500'}`}><QrCode size={20} /></div><div className="flex-1"><p className="font-semibold text-gray-900">Manual Transfer</p><p className="text-xs text-gray-500">External Wallet</p></div></div></div>
                            <button onClick={handlePayment} className={`w-full text-white font-bold py-4 rounded-xl shadow-lg transition-transform hover:scale-[1.02] flex items-center justify-center gap-2 ${paymentMethod === 'stripe' ? 'bg-[#635BFF]' : paymentMethod === 'moonpay' ? 'bg-[#7D00FF]' : 'bg-sky-500'}`}>Pay Now</button>
                        </div>
                    </div>
                    {/* Pass Business Address to Manual Widget */}
                    {showManualWidget && <ManualCryptoWidget address={businessAddress} amount={totalAmount} onClose={() => setShowManualWidget(false)} />}
                </div>
            );
        };

        const CustomerDashboard = ({ user, invoices, onUpdateStatus, onSaveProfile }) => {
            const [selectedInvoice, setSelectedInvoice] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [profileForm, setProfileForm] = useState({ name: user.name || "", address: user.address || "" });
            useEffect(() => { setProfileForm({ name: user.name || "", address: user.address || "" }); }, [user]);
            const handleSave = async (e) => { e.preventDefault(); await onSaveProfile(profileForm); setIsEditing(false); };
            if (selectedInvoice) return <InvoiceDetail invoice={selectedInvoice} customer={user} onBack={() => setSelectedInvoice(null)} onPaymentSuccess={() => { onUpdateStatus(selectedInvoice.id, 'Paid'); setSelectedInvoice({...selectedInvoice, status: 'Paid'}); }} />;
            return (
                <div className="max-w-4xl mx-auto space-y-8">
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <div className="flex justify-between items-start mb-4"><h2 className="text-xl font-bold text-gray-900">My Information</h2>{!isEditing && <button onClick={() => setIsEditing(true)} className="text-sky-600 text-sm font-medium hover:underline flex items-center gap-1"><Edit size={16} /> Edit Info</button>}</div>
                        {isEditing ? (
                            <form onSubmit={handleSave} className="space-y-4">
                                <input className="w-full p-2 border rounded" value={profileForm.name} onChange={e => setProfileForm({...profileForm, name: e.target.value})} placeholder="Name" />
                                <textarea className="w-full p-2 border rounded" value={profileForm.address} onChange={e => setProfileForm({...profileForm, address: e.target.value})} placeholder="Address" />
                                <div className="flex gap-2"><button className="bg-sky-500 text-white px-4 py-2 rounded-lg">Save</button><button type="button" onClick={() => setIsEditing(false)} className="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg">Cancel</button></div>
                            </form>
                        ) : (
                            <div className="grid md:grid-cols-2 gap-4 text-sm">
                                <div><p className="text-gray-500">Name</p><p className="font-medium text-lg">{user.name || "N/A"}</p></div>
                                <div><p className="text-gray-500">Email</p><p className="font-medium">{user.email || "N/A"}</p></div>
                                <div><p className="text-gray-500">Address</p><p className="font-medium">{user.address || "N/A"}</p></div>
                                <div><p className="text-gray-500">Wallet</p><p className="font-mono bg-slate-100 px-3 py-1.5 rounded-lg text-xs text-sky-700 break-all border border-slate-200">{user.walletAddress}</p></div>
                            </div>
                        )}
                    </div>
                    <div>
                        <h2 className="text-2xl font-bold text-gray-900 mb-6">Your Invoices</h2>
                        <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            {(invoices || []).length === 0 ? <div className="p-8 text-center text-gray-500">No invoices found.</div> : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left"><thead className="bg-slate-50 text-slate-500 text-sm"><tr><th className="px-6 py-4">Invoice #</th><th className="px-6 py-4">Date</th><th className="px-6 py-4">Due</th><th className="px-6 py-4">Total</th><th className="px-6 py-4">Status</th><th className="px-6 py-4"></th></tr></thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {(invoices || []).map(inv => {
                                            const items = inv.items || [];
                                            const total = items.reduce((acc, i) => acc + (parseFloat(i.qty||0) * parseFloat(i.unitPrice||0)), 0);
                                            return (
                                                <tr key={inv.id} className="hover:bg-slate-50">
                                                    <td className="px-6 py-4 font-mono text-gray-600">{inv.id}</td>
                                                    <td className="px-6 py-4 text-sm text-gray-600">{inv.date}</td>
                                                    <td className="px-6 py-4 text-sm text-gray-600">{inv.dueDate}</td>
                                                    <td className="px-6 py-4 font-medium text-gray-900">${total.toFixed(2)}</td>
                                                    <td className="px-6 py-4"><span className={`px-2 py-1 rounded-full text-xs font-bold ${inv.status === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{inv.status}</span></td>
                                                    <td className="px-6 py-4 text-right"><button onClick={() => setSelectedInvoice(inv)} className="text-sky-600 hover:text-sky-800 font-medium text-sm flex items-center gap-1">View <ArrowRight size={14} /></button></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody></table>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP SHELL ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [customers, setCustomers] = useState([]);
            const [invoices, setInvoices] = useState([]);

            useEffect(() => {
                if (!user) return;
                const unsubCustomers = onSnapshot(collection(db, "customers"), (snapshot) => {
                    setCustomers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubInvoices = onSnapshot(collection(db, "invoices"), (snapshot) => {
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (user.isAdmin) {
                        setInvoices(list);
                    } else {
                        const myCustomerRecord = (customers || []).find(c => c.email === user.email || (user.walletAddress && c.walletAddress === user.walletAddress));
                        if (myCustomerRecord) {
                            setInvoices(list.filter(inv => inv.customerId === myCustomerRecord.id));
                        } else {
                            setInvoices([]); 
                        }
                    }
                });
                return () => { unsubCustomers(); unsubInvoices(); };
            }, [user, customers.length]);

            const handleSaveProfile = async (data) => {
                let q;
                if (user.email) q = query(collection(db, "customers"), where("email", "==", user.email));
                else if (user.walletAddress) q = query(collection(db, "customers"), where("walletAddress", "==", user.walletAddress));
                
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    await DB.updateCustomer(querySnapshot.docs[0].id, data);
                } else {
                    await DB.addCustomer({ ...data, email: user.email || "", walletAddress: user.walletAddress || null });
                }
            };

            const handleLogout = async () => {
                if(user.web3authInstance) await user.web3authInstance.logout();
                setUser(null);
                setCustomers([]);
                setInvoices([]);
            };

            return (
                <div className="min-h-screen pb-12">
                    <Navbar user={user} onLogout={handleLogout} />
                    <main className="container mx-auto px-4 py-8">
                        {!user ? <LoginScreen onLogin={(u) => setUser(u)} /> : user.isAdmin ? <AdminDashboard user={user} customers={customers} invoices={invoices} onAddCustomer={DB.addCustomer} onDeleteCustomer={DB.deleteCustomer} onAddInvoice={DB.addInvoice} /> : <CustomerDashboard user={(customers || []).find(c => c.email === user.email || (user.walletAddress && c.walletAddress === user.walletAddress)) || user} invoices={invoices} onUpdateStatus={DB.updateInvoiceStatus} onSaveProfile={handleSaveProfile} />}
                    </main>
                    <footer className="text-center text-sm text-gray-400 py-8 no-print"><p>&copy; 2024 Mechanical Temp LLC. Secure Payment Portal.</p></footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
