            font-size: 13.5px;

            word-wrap: break-word;

        const AdminWalletWidget = ({ user }) => {
            const [balances, setBalances] = useState({ eth: "0.00", usdc: "0.00" });

                    if (!user.web3authInstance) return;
                    try {
                        const provider = new ethers.BrowserProvider(user.web3authInstance.provider);
                        const signer = await provider.getSigner();
                        const address = await signer.getAddress();
                        const ethBal = await provider.getBalance(address);
                        const usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, provider);
                        const usdcBal = await usdcContract.balanceOf(address);
                        setBalances({ eth: ethers.formatEther(ethBal), usdc: ethers.formatUnits(usdcBal, 6) });
                    } catch (e) { console.error("Error fetching balances:", e); }
                };
                fetchBalances();
            }, [user, txHash]);
            const handleSend = async (e) => {
                e.preventDefault();
                if (!confirm(`Send ${sendForm.amount} ${sendForm.asset} to ${sendForm.to}?`)) return;
                setLoading(true); setTxHash("");
                try {
                    const provider = new ethers.BrowserProvider(user.web3authInstance.provider);
                    const signer = await provider.getSigner();
                    let tx;
                    if (sendForm.asset === "ETH") tx = await signer.sendTransaction({ to: sendForm.to, value: ethers.parseEther(sendForm.amount) });
                    else { const usdcContract = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer); tx = await usdcContract.transfer(sendForm.to, ethers.parseUnits(sendForm.amount, 6)); }
                    setTxHash(tx.hash);
                    alert(`Success!\nHash: ${tx.hash}`);
                    setSendForm({ to: "", amount: "", asset: "ETH" });

                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Line Items</label>
                                {items.map((item, idx) => (
                                    <div key={idx} className="flex gap-2 mb-2">
                                        <input placeholder="Description" className="flex-1 p-2 border rounded" value={item.desc} onChange={e => updateItem(idx, 'desc', e.target.value)} required />
                                        <input type="number" placeholder="Qty" className="w-20 p-2 border rounded" value={item.qty} onChange={e => updateItem(idx, 'qty', e.target.value)} required />
                                        <input type="number" placeholder="Price" className="w-24 p-2 border rounded" value={item.unitPrice} onChange={e => updateItem(idx, 'unitPrice', e.target.value)} required />
                                        {items.length > 1 && <button type="button" onClick={() => removeItem(idx)} className="text-red-500 p-2"><Trash2 size={16}/></button>}
                                    </div>
                                ))}
                                <button type="button" onClick={addItem} className="text-sm text-sky-600 font-medium mt-2">+ Add Item</button>
                            </div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Comments</label><textarea className="w-full p-2 border rounded h-24" value={comments} onChange={e => setComments(e.target.value)} placeholder="Payment instructions, etc." /></div>
                            <div className="bg-slate-50 p-4 rounded text-right"><span className="text-gray-500 mr-2">Total:</span><span className="font-bold text-xl">${items.reduce((acc, i) => acc + (parseFloat(i.qty||0) * parseFloat(i.unitPrice||0)), 0).toFixed(2)}</span></div>
                            <button disabled={saving} className="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold">{saving ? "Saving..." : (isEdit ? "Update Invoice" : "Generate Invoice")}</button>
                        </form>
                    </div>
                );
            };

            const VaultSettings = () => {
                const [form, setForm] = useState({ ...vaultSettings });
                const [saved, setSaved] = useState(false);
                const handleSave = (e) => { e.preventDefault(); setVaultSettings(DB.updateVaultSettings(form)); setSaved(true); setTimeout(() => setSaved(false), 2000); };
                return (
                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm max-w-lg mx-auto">
                        <div className="flex items-center gap-2 mb-6 text-gray-900 font-bold text-xl"><button onClick={() => setView('dashboard')} className="hover:bg-gray-100 p-1 rounded"><ChevronLeft /></button><h3>Vault Allocation Settings</h3></div>
                        <form onSubmit={handleSave} className="space-y-4">
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Vault (Profit) Address</label><input className="w-full p-2 border rounded font-mono text-sm" value={form.address} onChange={e => setForm({...form, address: e.target.value})} /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Bank (Revenue) Address</label><input className="w-full p-2 border rounded font-mono text-sm" value={form.bankAddress} onChange={e => setForm({...form, bankAddress: e.target.value})} /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Allocation %</label><input type="number" className="w-full p-2 border rounded" value={form.percentage} onChange={e => setForm({...form, percentage: parseFloat(e.target.value)})} step="0.1" /></div>
                            <button className="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg font-bold">{saved ? "Saved!" : "Save"}</button>
                        </form>
                    </div>
                );
            };

            if (view === 'add-customer') return <AddCustomerForm />;
            if (view === 'view-customers') return <CustomerList />;
            if (view === 'edit-customer') return <EditCustomerForm />;
            if (view === 'invoice-form') return <InvoiceForm />;
            if (view === 'settings') return <VaultSettings />;

            const totalRevenue = (invoices || []).reduce((acc, inv) => { const items = inv.items || []; return acc + items.reduce((s, i) => s + (parseFloat(i.qty || 0) * parseFloat(i.unitPrice || 0)), 0); }, 0);
            const vaultShare = totalRevenue * (vaultSettings.percentage / 100);
            const sortedInvoices = [...invoices].sort((a, b) => new Date(a.date) - new Date(b.date));

            return (
                <div className="space-y-8">
                    <AdminWalletWidget user={user} /> 
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm"><p className="text-gray-500 text-sm font-medium">Total Revenue</p><h3 className="text-2xl font-bold text-gray-900">${totalRevenue.toFixed(2)}</h3></div>
                        <div className="bg-purple-50 p-6 rounded-xl border border-purple-100 shadow-sm">
                            <div className="flex justify-between items-start"><p className="text-purple-800 text-sm font-medium">Vault Share ({vaultSettings.percentage}%)</p><button onClick={() => setView('settings')} className="text-purple-400 hover:text-purple-600"><Settings size={16}/></button></div>
                            <h3 className="text-2xl font-bold text-purple-900">${vaultShare.toFixed(2)}</h3>
                            <p className="text-xs text-purple-600 mt-1 truncate">To: {vaultSettings.address.substring(0,8)}...</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm"><p className="text-gray-500 text-sm font-medium">Smart Contract Revenue</p><h3 className="text-2xl font-bold text-green-600">{onChainRev}</h3></div>
                    </div>
                    <div className="flex gap-4 flex-wrap">
                        <button onClick={() => { setEditingInvoice(null); setView('invoice-form'); }} className="flex items-center gap-2 bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm"><FileText size={18} /> New Invoice</button>
                        <button onClick={() => setView('view-customers')} className="flex items-center gap-2 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-slate-50"><Users size={18} /> Manage Customers</button>
                        <button onClick={() => setView('settings')} className="ml-auto flex items-center gap-2 text-slate-500 hover:text-slate-800 font-medium"><Settings size={20} /> Vault Settings</button>
                    </div>
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div className="px-6 py-4 border-b border-gray-200 bg-slate-50 font-bold text-gray-700">All Invoices</div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 text-slate-500"><tr><th className="px-6 py-3">Invoice #</th><th className="px-6 py-3">Customer</th><th className="px-6 py-3">Date</th><th className="px-6 py-3">Amount</th><th className="px-6 py-3">Status</th><th className="px-6 py-3 text-right">Actions</th></tr></thead>
                                <tbody className="divide-y divide-gray-100">
                                    {sortedInvoices.map(inv => {
                                        if (!inv.id || !inv.customerId) return null;
                                        const cust = (customers || []).find(c => c.id === inv.customerId);
                                        const items = inv.items || [];
                                        const total = items.reduce((acc, i) => acc + (parseFloat(i.qty||0) * parseFloat(i.unitPrice||0)), 0);
                                        return (
                                            <tr key={inv.docId} className="hover:bg-slate-50">
                                                <td className="px-6 py-4 font-mono text-gray-600">{inv.id}</td>
                                                <td className="px-6 py-4 font-medium">{cust ? cust.name : 'Unknown'}</td>
                                                <td className="px-6 py-4 text-gray-500">{inv.date || '-'}</td>
                                                <td className="px-6 py-4 font-medium">${total.toFixed(2)}</td>
                                                <td className="px-6 py-4"><span className={`px-2 py-1 rounded-full text-xs font-bold ${inv.status === 'Paid' ? 'bg-green-100 text-green-700' : inv.status === 'Overdue' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>{inv.status || 'Pending'}</span></td>
                                                <td className="px-6 py-4 text-right flex justify-end gap-2">
                                                    <button onClick={() => handleToggleStatus(inv)} className={`p-2 ${inv.status === 'Paid' ? 'text-green-600 hover:text-red-600' : 'text-gray-400 hover:text-green-600'}`} title={inv.status === 'Paid' ? "Mark Pending" : "Mark Paid"}>{inv.status === 'Paid' ? <CheckCircle2 size={18} fill="currentColor" className="opacity-20" /> : <CheckCircle2 size={18} />}</button>
                                                    <button onClick={() => handleEditInvoice(inv)} className="text-gray-400 hover:text-blue-600 p-2"><Edit size={18} /></button>
                                                    <button onClick={() => handleDeleteInvoice(inv.docId)} className="text-gray-400 hover:text-red-600 p-2"><Trash2 size={18} /></button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP SHELL ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [customers, setCustomers] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [showScheduler, setShowScheduler] = useState(false);

            useEffect(() => {
                if (!user) return;
                const unsubCustomers = onSnapshot(collection(db, "customers"), (snapshot) => {
                    setCustomers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubInvoices = onSnapshot(collection(db, "invoices"), (snapshot) => {
                    const list = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                    if (user.isAdmin) setInvoices(list);
                    else {
                        const myCustomerRecord = (customers || []).find(c => c.email === user.email || (user.walletAddress && c.walletAddress === user.walletAddress));
                        if (myCustomerRecord) setInvoices(list.filter(inv => inv.customerId === myCustomerRecord.id));
                        else setInvoices([]); 
                    }
                });
                return () => { unsubCustomers(); unsubInvoices(); };
            }, [user, customers.length]);

            const handleSaveProfile = async (data) => {
                let q;
                if (user.email) q = query(collection(db, "customers"), where("email", "==", user.email));
                else if (user.walletAddress) q = query(collection(db, "customers"), where("walletAddress", "==", user.walletAddress));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) await DB.updateCustomer(querySnapshot.docs[0].id, data);
                else await DB.addCustomer({ ...data, email: user.email || "", walletAddress: user.walletAddress || null });
            };

            const handleLogout = async () => {
                if(user.web3authInstance) await user.web3authInstance.logout();
                setUser(null); setCustomers([]); setInvoices([]);
            };

            // Resolve the rich customer record for Tempi (her context)
            const resolvedUser = user 
                ? (user.isAdmin 
                    ? user 
                    : ((customers || []).find(c => c.email === user.email || (user.walletAddress && c.walletAddress === user.walletAddress)) || user))
                : null;

            return (
                <div className="min-h-screen pb-12 relative">
                    <Navbar user={user} onLogout={handleLogout} onSchedule={() => setShowScheduler(true)} />
                    <main className="container mx-auto px-4 py-8">
                        {!user ? (
                            <LoginScreen onLogin={(u) => setUser(u)} />
                        ) : user.isAdmin ? (
                            <AdminDashboard user={user} customers={customers} invoices={invoices} onAddCustomer={DB.addCustomer} onDeleteCustomer={DB.deleteCustomer} onAddInvoice={DB.addInvoice} onUpdateInvoice={DB.updateInvoice} onDeleteInvoice={DB.deleteInvoice} onUpdateStatus={DB.updateInvoiceStatus} />
                        ) : (
                            <CustomerDashboard user={resolvedUser} invoices={invoices} onUpdateStatus={DB.updateInvoiceStatus} onSaveProfile={handleSaveProfile} onOpenScheduler={() => setShowScheduler(true)} />
                        )}
                    </main>
                    <footer className="text-center text-sm text-gray-400 py-8 no-print"><p>&copy; 2025 Mechanical Temp LLC. Secure Payment Portal.</p></footer>
                    
                    {/* --- TEMPI (NEW) --- */}
                    <TempiWidget 
                        currentUser={resolvedUser} 
                        userInvoices={invoices} 
                        customers={customers}
                    />
                    
                    <SchedulerModal isOpen={showScheduler} onClose={() => setShowScheduler(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
