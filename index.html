                        rpcTarget: RPC_URL,
                        displayName: "Arbitrum One",
                        blockExplorerUrl: "https://arbiscan.io",
                        ticker: "ETH",
                        tickerName: "Ethereum",
                    };

                    const privateKeyProvider = new EthereumPrivateKeyProvider({ config: { chainConfig } });
                    
                    const web3auth = new Web3Auth({
                        clientId: WEB3AUTH_CLIENT_ID,
                        web3AuthNetwork: "sapphire_mainnet",
                        privateKeyProvider
                    });

                    await web3auth.initModal();
                    const provider = await web3auth.connect();
                    const userInfo = await web3auth.getUserInfo();
                    const ethersProvider = new ethers.BrowserProvider(provider);
                    const signer = await ethersProvider.getSigner();
                    const address = await signer.getAddress();

                    if (userInfo.email === "admin@mechanicaltemp.com") {
                        onLogin({ 
                            email: userInfo.email, 
                            isAdmin: true, 
                            name: "Admin", 
                            walletAddress: address, 
                            web3authInstance: web3auth 
                        });
                        return;
                    }

                    let q;
                    if(userInfo.email) {
                        q = query(collection(db, "customers"), where("email", "==", userInfo.email));
                    } else {
                        q = query(collection(db, "customers"), where("walletAddress", "==", address));
                    }
                    
                    const querySnapshot = await getDocs(q);
                    let userData;
                    
                    if (!querySnapshot.empty) {
                        const docData = querySnapshot.docs[0].data();
                        userData = {
                            id: querySnapshot.docs[0].id,
                            email: userInfo.email || docData.email,
                            name: docData.name || userInfo.name || "User",
                            walletAddress: address, 
                            isAdmin: false,
                            address: docData.address || "",
                            web3authInstance: web3auth
                        };
                    } else {
                        userData = {
                            email: userInfo.email || "",
                            name: userInfo.name || "Guest",
                            walletAddress: address,
                            isAdmin: false,
                            isNew: true,
                            web3authInstance: web3auth
                        };
                    }
                    onLogin(userData);

                    console.error("Web3Auth Login Error:", err);
                    setError("Login cancelled or failed.");

            const [isWaitingForPayment, setIsWaitingForPayment] = useState(false);
            
            const savedSettings = localStorage.getItem('mt_vault_settings');
            const vaultSettings = savedSettings ? JSON.parse(savedSettings) : {};
            const businessAddress = vaultSettings.bankAddress || vaultSettings.address || "0xE6b8EAb212c8E33c825e49E6C36F3030955E890d"; 

            const items = invoice.items || [];
            const totalAmount = items.reduce((acc, item) => acc + (parseFloat(item.qty||0) * parseFloat(item.unitPrice||0)), 0);

            const handleContractPay = async () => {
                if(!customer.web3authInstance && !window.ethereum) return alert("Please connect a wallet to use Smart Contract payment.");
                
                setIsMining(true);
                try {
                    let provider;
                    if(customer.web3authInstance) {
                        provider = new ethers.BrowserProvider(customer.web3authInstance.provider);
                    } else {
                        provider = new ethers.BrowserProvider(window.ethereum);
                    }
                    
                    const signer = await provider.getSigner();
                    const userAddr = await signer.getAddress();
                    
                    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                    const usdc = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);
                    
                    const amount6 = ethers.parseUnits(totalAmount.toString(), 6);
                    
                    const allowance = await usdc.allowance(userAddr, CONTRACT_ADDRESS);
                    if(allowance < amount6) {
                         alert("Step 1/2: Please approve USDC spending in your wallet.");
                         const txApprove = await usdc.approve(CONTRACT_ADDRESS, amount6);
                         await txApprove.wait();
                    }

                    alert("Step 2/2: Confirm Payment Transaction.");
                    const tx = await contract.payInvoice(invoice.id, amount6);
                    
                    alert(`Transaction Sent! Hash: ${tx.hash}`);
                    await tx.wait();
                    
                    onPaymentSuccess();
                    
                } catch (e) {
                    console.error(e);
                    alert("Payment failed: " + (e.reason || e.message));
                } finally {
                    setIsMining(false);
                }

            const handlePayment = () => {
                if (paymentMethod === 'stripe') {

                        if(confirm(`$${amountStr} has been copied to your clipboard!\n\nStandard Stripe Payment Links do not allow automatic pricing.\n\nPlease PASTE the amount into the "Price" field on the next screen.\n\nClick OK to proceed to Stripe.`)) {

                            </div>

                            <tr key={i}><td className="px-4 py-4">{item.desc}</td><td className="px-4 py-4 text-center">{item.qty}</td><td className="px-4 py-4 text-right">${parseFloat(item.unitPrice).toFixed(2)}</td><td className="px-4 py-4 text-right font-medium">${(parseFloat(item.qty)*parseFloat(item.unitPrice)).toFixed(2)}</td></tr>
                        ))}</tbody></table>
                        <div className="flex justify-end border-t border-gray-100 pt-6"><div className="w-48 flex justify-between items-center text-lg font-bold text-gray-900"><span>Total Due</span><span>${totalAmount.toFixed(2)}</span></div></div>
                    </div>
                    <div className="w-full lg:w-[380px] no-print">
                        <div className="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sticky top-24">
                            
                            {!isWaitingForPayment ? (
                                <>
                                    <h3 className="font-bold text-gray-900 mb-4">Select Payment Method</h3>
                                    <div onClick={() => setPaymentMethod('stripe')} className={`p-4 rounded-xl border-2 cursor-pointer mb-3 transition-all ${paymentMethod === 'stripe' ? 'border-[#635BFF] bg-indigo-50' : 'border-gray-100 hover:border-gray-200'}`}><div className="flex items-center gap-3"><div className={`p-2 rounded-lg ${paymentMethod === 'stripe' ? 'bg-[#635BFF] text-white' : 'bg-gray-100 text-gray-500'}`}><CreditCard size={20} /></div><div className="flex-1"><p className="font-semibold text-gray-900">Credit Card</p><p className="text-xs text-gray-500">via Stripe Checkout</p></div></div></div>

            const BulkImport = () => {
                const [parsedData, setParsedData] = useState([]);
                const [processing, setProcessing] = useState(false);

                // Helper to calculate date from "Overdue Period"
                // Returns string "YYYY-MM-DD"
                const calculateDueDateFromPeriod = (periodString) => {
                    const today = new Date();
                    let daysAgo = 0;

                    const p = periodString ? periodString.toLowerCase() : "";

                    if (p.includes("1-30")) daysAgo = 15; // Average
                    else if (p.includes("31-60")) daysAgo = 45;
                    else if (p.includes("61-90")) daysAgo = 75;
                    else if (p.includes("90+")) daysAgo = 100;
                    else if (p.includes("current")) daysAgo = -30; // Due in future

                    today.setDate(today.getDate() - daysAgo);
                    return today.toISOString().split('T')[0];
                };

                const handleFileUpload = (e) => {
                    const file = e.target.files[0];
                    if(!file) return;

                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const text = evt.target.result;
                        const lines = text.split('\n');
                        const results = [];

                        // Simple CSV parser (assuming comma separated)
                        // Expected Format: CustomerName, InvoiceID, Amount, OverduePeriod
                        
                        // Skip header row if present (simple check)
                        let startIndex = 0;
                        if (lines[0].toLowerCase().includes("customer")) startIndex = 1;

                        for (let i = startIndex; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;

                            // Basic CSV Split (ignores complex quotes for simplicity)
                            const cols = line.split(',');
                            
                            if (cols.length >= 3) {
                                const name = cols[0].trim();
                                const invId = cols[1].trim();
                                const amtStr = cols[2].replace(/[$,]/g, '').trim();
                                const period = cols[3] ? cols[3].trim() : "Current";

                                if (name && invId) {
                                    results.push({
                                        customerName: name,
                                        invoiceId: invId,
                                        amount: parseFloat(amtStr) || 0,
                                        period: period,
                                        calculatedDate: calculateDueDateFromPeriod(period)
                                    });
                                }
                            }
                        }
                        setParsedData(results);
                    };
                    reader.readAsText(file);
                };

                const handleUpload = async () => {
                    if(!confirm(`Create ${parsedData.length} invoices?`)) return;
                    setProcessing(true);
                    
                    const custSnapshot = await getDocs(collection(db, "customers"));
                    let existingCustomers = custSnapshot.docs.map(d => ({id: d.id, ...d.data()}));

                    for (const item of parsedData) {
                        try {
                            let customerId;
                            let found = existingCustomers.find(c => c.name.toLowerCase() === item.customerName.toLowerCase());
                            
                            if (found) {
                                customerId = found.id;
                            } else {
                                const newCustRef = await onAddCustomer({
                                    name: item.customerName,
                                    email: "", 
                                    address: "Imported via CSV",
                                    notes: "Bulk Imported"
                                });
                                customerId = newCustRef.id;
                                existingCustomers.push({ id: customerId, name: item.customerName });
                            }

                            // Determine status based on Period
                            let status = "Pending";
                            if (item.period.toLowerCase().includes("overdue")) status = "Overdue";

                            await onAddInvoice({
                                id: `INV-${item.invoiceId}`,
                                customerId: customerId,
                                date: item.calculatedDate, // Use the calculated date
                                dueDate: "Net 30", // Default term
                                status: status,
                                items: [{ desc: `Imported Balance (${item.period})`, qty: 1, unitPrice: item.amount }],
                                comments: `Imported from CSV. Period: ${item.period}`
                            });

                        } catch (e) {
                            console.error("Error importing item:", item, e);
                        }
                    }
                    setProcessing(false);
                    setParsedData([]);
                    alert("Import Complete!");
                    setView('dashboard');
                };

                return (
                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm max-w-4xl mx-auto animate-in fade-in slide-in-from-bottom-4">
                        <div className="flex items-center gap-2 mb-6 text-gray-900 font-bold text-xl">
                            <button onClick={() => setView('dashboard')} className="hover:bg-gray-100 p-1 rounded"><ChevronLeft /></button>
                            <h3>Bulk CSV Import</h3>
                        </div>
                        
                        <div className="space-y-6">
                            <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-8 text-center">
                                <Upload className="mx-auto text-slate-400 mb-2" size={48} />

                                                <td className="px-6 py-4 text-right flex justify-end gap-2">
                                                    <button onClick={() => handleToggleStatus(inv)} className={`p-2 ${inv.status === 'Paid' ? 'text-green-600 hover:text-red-600' : 'text-gray-400 hover:text-green-600'}`} title={inv.status === 'Paid' ? "Click to mark Pending" : "Click to mark Paid"}>{inv.status === 'Paid' ? <CheckCircle2 size={18} fill="currentColor" className="opacity-20" /> : <CheckCircle2 size={18} />}</button>
                                                    <button onClick={() => handleEditInvoice(inv)} className="text-gray-400 hover:text-blue-600 p-2" title="Edit Invoice"><Edit size={18} /></button>
                                                    <button onClick={() => handleDeleteInvoice(inv.docId)} className="text-gray-400 hover:text-red-600 p-2" title="Delete Invoice"><Trash2 size={18} /></button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP SHELL ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [customers, setCustomers] = useState([]);
            const [invoices, setInvoices] = useState([]);
            const [showScheduler, setShowScheduler] = useState(false);

            useEffect(() => {
                if (!user) return;
                const unsubCustomers = onSnapshot(collection(db, "customers"), (snapshot) => {
                    setCustomers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubInvoices = onSnapshot(collection(db, "invoices"), (snapshot) => {
                    // FIX: Ensure we map docId correctly to handle DB operations
                    const list = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                    if (user.isAdmin) {
                        setInvoices(list);
                    } else {
                        const myCustomerRecord = (customers || []).find(c => c.email === user.email || (user.walletAddress && c.walletAddress === user.walletAddress));
                        if (myCustomerRecord) {
                            setInvoices(list.filter(inv => inv.customerId === myCustomerRecord.id));
                        } else {
                            setInvoices([]); 
                        }
                    }
                });
                return () => { unsubCustomers(); unsubInvoices(); };
            }, [user, customers.length]);

            const handleSaveProfile = async (data) => {
                let q;
                if (user.email) q = query(collection(db, "customers"), where("email", "==", user.email));
                else if (user.walletAddress) q = query(collection(db, "customers"), where("walletAddress", "==", user.walletAddress));
                
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    await DB.updateCustomer(querySnapshot.docs[0].id, data);
                } else {
                    await DB.addCustomer({ ...data, email: user.email || "", walletAddress: user.walletAddress || null });
                }
            };

            const handleLogout = async () => {
                if(user.web3authInstance) await user.web3authInstance.logout();
                setUser(null);
                setCustomers([]);
                setInvoices([]);
            };

            return (
                <div className="min-h-screen pb-12 relative">
                    <Navbar user={user} onLogout={handleLogout} onSchedule={() => setShowScheduler(true)} />
                    <main className="container mx-auto px-4 py-8">
                        {!user ? (
                            <LoginScreen onLogin={(u) => setUser(u)} />
                        ) : user.isAdmin ? (
                            <AdminDashboard 
                                user={user} 
                                customers={customers} 
                                invoices={invoices} 
                                onAddCustomer={DB.addCustomer} 
                                onDeleteCustomer={DB.deleteCustomer} 
                                onAddInvoice={DB.addInvoice} 
                                onUpdateInvoice={DB.updateInvoice} 
                                onDeleteInvoice={DB.deleteInvoice} 
                                onUpdateStatus={DB.updateInvoiceStatus} 
                            />
                        ) : (
                            <CustomerDashboard 
                                user={(customers || []).find(c => c.email === user.email || (user.walletAddress && c.walletAddress === user.walletAddress)) || user} 
                                invoices={invoices} 
                                onUpdateStatus={DB.updateInvoiceStatus} 
                                onSaveProfile={handleSaveProfile}
                                onOpenScheduler={() => setShowScheduler(true)} 
                            />
                        )}
                    </main>
                    <footer className="text-center text-sm text-gray-400 py-8 no-print"><p>&copy; 2025 Mechanical Temp LLC. Secure Payment Portal.</p></footer>
                    
                    {/* --- GLOBAL COMPONENTS --- */}
                    <ChatWidget />
                    <SchedulerModal isOpen={showScheduler} onClose={() => setShowScheduler(false)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
